<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인사기록 대시보드</title>
<style>
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#F6F8FB;--ink:#172033;--sub:#5B6577;--mute:#8791A3;--line:#D9DEE7;
  --accent:#2B50C8;--accent-ink:#FFFFFF;--accent-soft:#E6ECFB;--accent2:#0E8F7E;
  --warn:#9A5B00;--warn-bg:#FDF1D3;--err:#B42318;--err-bg:#FDE7E4;--ok:#17754F;--ok-bg:#DDF3E8;
  --radius:10px;--shadow:0 1px 2px rgba(23,32,51,.06),0 6px 20px rgba(23,32,51,.06);
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
}
body[data-theme="c"]{
  --bg:#12161F;--surface:#1B2130;--surface2:#222A3B;--ink:#E8ECF4;--sub:#A3ADBF;--mute:#7C879B;--line:#2F384C;
  --accent:#7FB0FF;--accent-ink:#0E1420;--accent-soft:#25324D;--accent2:#F0B95A;
  --warn:#F3C267;--warn-bg:#3D3219;--err:#FF9A8F;--err-bg:#45221F;--ok:#7FD6AC;--ok-bg:#1D3A2E;
  --radius:12px;--shadow:0 1px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{--side-bg:var(--surface);--side-ink:var(--ink);--side-sub:var(--sub);--side-line:var(--line);--side-field:var(--surface);font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}

/* layout */
.app{display:grid;grid-template-columns:1fr;grid-template-areas:"top" "filters" "main";min-height:100vh}
.topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;margin-right:8px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--sub);letter-spacing:0}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn .cnt{background:var(--err-bg);color:var(--err);border-radius:99px;padding:0 7px;font-size:12px;font-weight:700}
.btn .cnt.zero{background:var(--ok-bg);color:var(--ok)}
.field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;height:36px}
.field label{font-size:12px;color:var(--sub);white-space:nowrap}
.field input,.field select{border:0;background:transparent;height:32px;outline:0;min-width:0}
.field input[type=search]{width:170px}
.field:focus-within{border-color:var(--accent)}
select option{color:#172033;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:7px;color:var(--sub);cursor:pointer;white-space:nowrap}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:16px}

.demo-banner{background:var(--accent-soft);color:var(--ink);padding:8px 24px;display:flex;gap:12px;align-items:center;font-size:13px;border-bottom:1px solid var(--line)}
.demo-banner b{color:var(--accent)}
.demo-banner .btn{padding:3px 10px;font-size:12.5px}

.filters{grid-area:filters;display:flex;gap:8px;align-items:center;padding:12px 24px 0;flex-wrap:wrap;color:var(--side-ink)}
.filters h2{display:none}
.filters .field{background:var(--side-field);border-color:var(--side-line)}
.filters .field label{color:var(--side-sub)}
.filters .reset{color:var(--side-sub)}
.main{grid-area:main;padding:16px 24px 28px;min-width:0}

body[data-theme="c"] input{color-scheme:dark}

/* summary cards */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:112px}
.sum:hover{border-color:var(--accent)}
.sum[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sum .t{font-size:12.5px;color:var(--sub);font-weight:600}
.sum .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sum .v small{font-size:13px;font-weight:500;color:var(--sub);margin-left:3px}
.sum .d{font-size:12.5px;color:var(--sub)}
.sum .d b{color:var(--ink);font-weight:600}
.sum .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .split .v,.sum .split .d{display:block}
.sum .split>span{display:block;border-radius:6px;padding:2px 6px;margin:-2px -6px}
.sum .split>span:hover,.sum .chip:hover{background:var(--accent-soft)}
.sum .split>span.on,.sum .chip.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.sum .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.sum .chip{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px}
.sum.caution .v{color:var(--warn)}

/* list */
.listhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.listhead .count{color:var(--sub)}
.listhead .active-filter{background:var(--accent-soft);border-radius:99px;padding:2px 4px 2px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.listhead .active-filter button{border:0;background:transparent;color:var(--sub);padding:0 6px;font-size:15px}
.group{margin-bottom:22px}
.group h3{margin:0 0 10px;font-size:14px;font-weight:700;display:flex;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.group h3 span{font-weight:500;color:var(--sub);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;grid-template-columns:48px 1fr;gap:12px;text-align:left;box-shadow:var(--shadow);align-items:start}
.pcard:hover{border-color:var(--accent)}
.pcard.left{opacity:.62;background:var(--surface2)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.pcard .nm{font-weight:700;font-size:15px}
.pcard .nm span{font-weight:500;color:var(--sub);font-size:12.5px;margin-left:6px}
.pcard .meta{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard>span{min-width:0}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--surface2);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.badge.err{background:var(--err-bg);color:var(--err);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
table.list{table-layout:fixed;width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.list th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
table.list td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.list th:nth-child(1){width:10%}table.list th:nth-child(2){width:9%}table.list th:nth-child(3){width:15%}table.list th:nth-child(4),table.list th:nth-child(5){width:8%}table.list th:nth-child(6){width:10%}table.list th:nth-child(7){width:10%}table.list th:nth-child(8){width:8%}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:var(--accent-soft)}
table.list tr.left td{color:var(--mute)}
table.list td .badges{margin:0}

/* empty */
.empty{max-width:560px;width:100%;margin:9vh auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:40px 36px;box-shadow:var(--shadow)}
.empty h1{font-size:22px;margin:0 0 8px;letter-spacing:-.02em}
.empty p{color:var(--sub);margin:0 0 22px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty .btn{padding:10px 18px;font-size:15px}
.empty .note{font-size:12.5px;color:var(--mute);margin:20px 0 0}

/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.dialog{background:var(--surface);border-radius:14px;width:min(860px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line);overflow:hidden}
.dhead{display:flex;gap:14px;align-items:center;padding:18px 22px 14px}
.dhead .avatar{width:60px;height:60px;font-size:22px}
.dhead h2{margin:0;font-size:20px;letter-spacing:-.02em}
.dhead h2 span{font-size:13px;color:var(--sub);font-weight:500;margin-left:8px}
.dhead .sub{color:var(--sub);font-size:13px}
.dhead .x{border:0;background:transparent;font-size:22px;color:var(--sub);padding:2px 8px;border-radius:6px}
.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:9px 12px;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tabs button .n{font-size:11.5px;color:var(--mute);margin-left:4px;font-weight:500}
.dbody{padding:20px 22px 26px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--sub)}.kv dd{margin:0;font-weight:600;text-align:right}
.none{color:var(--mute);background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center}
.sec{margin:0 0 22px}
.sec h4{margin:0 0 8px;font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.sec h4 span{font-weight:500;color:var(--sub);font-size:12.5px}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.num,table.t th.num{text-align:right}
.issues-box{margin:0 0 16px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);padding:10px 12px;font-size:13px}
.issues-box div{display:flex;gap:8px;align-items:baseline;padding:2px 0}
/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 6px}
.tl li{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--line);margin-left:6px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.edge::before{background:var(--accent)}
.tl .dt{font-size:12.5px;color:var(--sub)}
.tl .ev{font-weight:600}
.tl .ev .badge{margin-right:6px}
.tl .memo{font-size:12.5px;color:var(--sub)}
/* grades */
.g{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-weight:700;font-size:13px;background:var(--surface2);border:1px solid var(--line)}
.g.hi{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.g.lo{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--font);font-size:11.5px;fill:var(--sub)}
.chart .ttl{font-size:12px;font-weight:600;fill:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;white-space:nowrap;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip b{font-size:13px}
.yeargroup{margin-bottom:16px}
.yeargroup h5{margin:0 0 6px;font-size:15px}
.yeargroup ul{margin:0;padding-left:18px}
/* validation */
.vsum{display:flex;gap:10px;margin-bottom:14px}
.vsum div{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.vsum b{font-size:20px;display:block}
/* tour */
.tour-pop{position:fixed;z-index:60;width:300px;background:var(--ink);color:var(--surface);border-radius:12px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.tour-pop h6{margin:0 0 4px;font-size:14px}
.tour-pop p{margin:0 0 12px;font-size:13px;opacity:.9}
.tour-pop .row{display:flex;align-items:center;gap:8px;font-size:12px}
.tour-pop button{border:0;border-radius:6px;padding:5px 10px;background:var(--surface);color:var(--ink);font-weight:600}
.tour-pop button.skip{background:transparent;color:var(--surface);opacity:.7;font-weight:500}
.tour-ring{position:fixed;z-index:55;border-radius:12px;box-shadow:0 0 0 3px var(--accent),0 0 0 9999px rgba(10,14,24,.45);pointer-events:none;transition:all .2s}
#printCard{display:none}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000;font-size:10.5pt}
  .app,.scrim,.tour-pop,.tour-ring,.demo-banner{display:none !important}
  #printCard{display:block}
  #printCard h1{font-size:16pt;margin:0 0 2mm;border-bottom:2px solid #000;padding-bottom:2mm}
  #printCard .ph{display:flex;justify-content:space-between;font-size:9pt;color:#444;margin-bottom:4mm}
  #printCard h2{font-size:11pt;margin:5mm 0 1.5mm;border-bottom:1px solid #000;padding-bottom:1mm}
  #printCard table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #printCard th,#printCard td{border:1px solid #999;padding:1.2mm 2mm;text-align:left;vertical-align:top}
  #printCard th{background:#eee;width:auto;font-weight:600}
  #printCard .pnone{color:#666;font-size:9.5pt}
  #printCard section{break-inside:avoid}
}
#miscScrim table.t td:nth-child(-n+4){white-space:nowrap}

.scrim.person{justify-content:flex-end;padding:0}
.scrim.person .dialog{height:100vh;max-height:none;width:min(760px,100%);border-radius:0;border-width:0 0 0 1px}
.dhead{flex:none}

.main{display:flex;flex-direction:column}
.main>#content,.main>.empty{flex:none}
.foot{margin-top:auto;padding:36px 0 0;text-align:center;font-size:12px;color:var(--mute)}
@media print{.foot{display:none}}
.app{grid-template-rows:auto auto 1fr}

.promo-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.promo-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table.promo{font-size:13px}
table.promo th{background:var(--surface2);position:sticky;top:0;white-space:nowrap}
table.promo td{white-space:nowrap;vertical-align:middle}
table.promo tr.ok td{background:var(--ok-bg)}
table.promo td.why{color:var(--sub);white-space:normal;min-width:200px}
@page promo{size:A4 landscape;margin:10mm}
@media print{
  #printCard.promo-print{page:promo}
  #printCard.promo-print table{font-size:8pt}
  #printCard.promo-print th{background:#1F3A5F !important;color:#fff;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printCard.promo-print td{text-align:center;padding:1mm 1.2mm}
  #printCard.promo-print .note{break-inside:avoid;margin-top:6mm}
  #printCard.promo-print .note h2{font-size:10.5pt;border:0;margin:0 0 2mm;padding:0}
  #printCard.promo-print .notebox{border:1px solid #999;height:38mm}
  #printCard.promo-print tr.ok td{background:#DDF3E0 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printCard.promo-print tr{break-inside:avoid}
}

</style>
</head>
<body data-theme="a">
<div class="app">
  <header class="topbar">
    <div class="brand">인사기록 대시보드<small id="fileLabel">엑셀 파일을 선택해 주세요</small></div>
    <button class="btn primary" data-pick>엑셀 파일 선택</button>
    <button class="btn" data-photos title="사진 파일명은 성명(예: 홍길동.jpg) 또는 사번(예: T0001.jpg)"><span id="photoLabel">사진 폴더 선택</span></button>
    <div class="field"><label for="baseDate">기준일</label><input type="date" id="baseDate"></div>
    <div class="field"><label for="q">검색</label><input type="search" id="q" placeholder="성명 또는 사번"></div>
    <span class="spacer"></span>
    <label class="switch" id="hideSwitch"><input type="checkbox" id="hide">민감 정보 숨김</label>
    <button class="btn" id="promoBtn">승격 심사</button>
    <button class="btn" id="valBtn">검사 결과</button>
    <div class="seg" id="themeSeg" aria-label="화면 모드">
      <button data-theme="a">라이트</button><button data-theme="c">다크</button>
    </div>
  </header>
  <aside class="filters hidden" id="filters">
    <h2>필터</h2>
    <div class="field"><label for="fDiv">사업부·본부</label><select id="fDiv"></select></div>
    <div class="field"><label for="fSil">실</label><select id="fSil"></select></div>
    <div class="field"><label for="fTeam">팀</label><select id="fTeam"></select></div>
    <div class="field"><label for="fEmp">고용형태</label><select id="fEmp"></select></div>
    <div class="field"><label for="fGrade">직급</label><select id="fGrade"></select></div>
    <div class="field"><label for="fState">재직상태</label><select id="fState"></select></div>
    <button class="btn ghost reset" id="resetF">필터 초기화</button>
  </aside>
  <main class="main">
    <div class="demo-banner hidden" id="demoBanner" style="margin:-16px -24px 16px"><span><b>가상 샘플데이터</b>로 둘러보는 중입니다 (실제 인물·회사와 무관, 기준일 2026-11-13). 실제 파일을 선택하면 바로 바뀝니다.</span><span class="spacer"></span><button class="btn" id="tourBtn">안내 다시 보기</button><button class="btn" id="exitDemo">둘러보기 끝내기</button></div>
    <div class="empty" id="empty">
      <h1>인사기록 엑셀을 선택해 주세요</h1>
      <p>업로드용 서식(.xlsx)을 고르면 전체 인원이 조직도 순서로 펼쳐지고,<br>이름을 누르면 그 사람의 인사기록 창이 열립니다.</p>
      <div class="row"><button class="btn primary" data-pick>엑셀 파일 선택</button><button class="btn" data-demo>샘플데이터로 둘러보기</button></div>

    list.forEach(function(c){
      if (!c.ok) return;
      var s = ms(c['시작일']), e = ms(c['종료일'])+DAY; if (join) e = Math.min(e, ms(join));
      if (e > s) iv.push([s, e, c.ratio]);
    });
    var pts = []; iv.forEach(function(x){ pts.push(x[0], x[1]); });
    pts = pts.filter(function(v,i,a){ return a.indexOf(v)===i; }).sort(function(a,b){ return a-b; });
    var segs = [];
    for (var i=0;i<pts.length-1;i++){
      var best = 0; iv.forEach(function(x){ if (x[0]<=pts[i] && x[1]>=pts[i+1]) best = Math.max(best, x[2]); });
      var last = segs[segs.length-1];
      if (last && last[1]===pts[i] && last[2]===best) last[1] = pts[i+1]; else segs.push([pts[i], pts[i+1], best]);
    }
    var sum = 0;
    segs.forEach(function(g){ if (!g[2]) return; var q = diffYM(ymd(g[0]), ymd(g[1])); sum += (q.total + q.d/30)*g[2]; });
    return sum;   // 개월
  }

  function buildModel(raw){

      var p = {_row:r._row, id:id, name:nm, dept:str(r['부서']), gender:str(r['성별']), pos:str(r['직책']), grade:str(r['직급']),

    });

    function attach(sheet, fn){
      var s = rows(raw, sheet, issues, missing);
      s.rows.forEach(function(r){
        var id = str(r['사번']), nm = str(r['성명']), p = byId[id];
        if (!p){ push('warn','사번 미등록',sheet,r._row,id,nm, (id==='동명이인'||id==='미등록 성명') ? '사번 칸이 "'+id+'"로 표시됨, 이 행은 제외' : '사번 "'+id+'"가 01_기본정보에 없어 이 행은 제외'); return; }
        r._bad.forEach(function(b){ p.issues.push({lv:'err',type:'날짜 형식',msg:sheet+' '+r._row+'행 '+b}); push('err','날짜 형식',sheet,r._row,id,nm,b); });

    attach('06_평가', function(p,r,head){ head.forEach(function(h){ if (/^\d{4}$/.test(h)){ if (years.eval.indexOf(+h)<0) years.eval.push(+h); var g=str(r[h]).toUpperCase(); if (g) p.evals[h]=g; } }); });
    attach('07_연봉', function(p,r,head){ head.forEach(function(h){ if (/^\d{4}$/.test(h)){ if (years.sal.indexOf(+h)<0) years.sal.push(+h); var v=r[h]; if (typeof v==='string') v=parseFloat(v.replace(/,/g,'')); if (typeof v==='number' && v>0) p.sal[h]=v; } }); });
    attach('08_상벌', function(p,r){ p.rewards.push(r); });

    // 마지막 발령과 기본정보 비교

      var last = {};
      p.moves.forEach(function(m){ var f = FIELD[m['발령구분']]; if (f && m['변경후']) last[f[0]] = {v:m['변경후'], label:f[1], d:m['발령일']}; });

      });

  /* ---------- 승격 심사 ---------- */
  function parsePromo(raw){
    var aoa = raw['_승격기준']; if (!aoa) return null;
    var hi = -1; for (var i=0;i<aoa.length;i++) if (aoa[i] && aoa[i].map(str).indexOf('현직급')>=0){ hi=i; break; }
    if (hi<0) return null;
    var head = aoa[hi].map(str), c = function(h){ return head.indexOf(h); };
    var P = {rules:{}, score:{}, legacy:{}, exclude:[]};
    for (var r=hi+1;r<aoa.length;r++){
      var row = aoa[r]||[], g = function(h){ var k = c(h); return k<0 ? null : row[k]; };
      if (!blank(g('현직급')) && !blank(g('승격 후 직급')) && +g('필요 개월')>=0 && +g('평가 연수')>0) P.rules[str(g('현직급'))] = {to:str(g('승격 후 직급')), kind:str(g('경력 종류')), months:+g('필요 개월'), years:+g('평가 연수'), avg:+g('평균 기준')};
      if (!blank(g('등급'))) P.score[str(g('등급')).toUpperCase()] = +g('점수');
      if (!blank(g('구직급'))) P.legacy[str(g('구직급'))] = str(g('현행 직급'));
      if (!blank(g('명단 제외 고용형태'))) P.exclude.push(str(g('명단 제외 고용형태')));
    }
    return P;
  }
  /* 발령에 적힌 직급(구직급 포함)을 현행 직급으로: "주임", "주임(CL2)", "차장(CL3 동일)", "CL3" 모두 허용 */
  function toCL(v, P, grades){
    v = str(v); if (!v) return '';
    var m = v.match(/CL\s*\d/i); if (m) return m[0].replace(/\s/g,'').toUpperCase();
    var b = v.replace(/\(.*?\)/g,'').trim();
    return P.legacy[b] || (grades.indexOf(b)>=0 ? b : '');
  }
  function promoList(model, date){   // date = 심사 기준일(YYYY-06-30 또는 YYYY-12-31), 당일 포함
    var P = model.promo; if (!P) return null;
    var maxYears = Math.max.apply(null, Object.keys(P.rules).map(function(k){ return P.rules[k].years; }).concat([1]));
    var Y = +date.slice(0,4), june = date.slice(5,7)==='06', next = ymd(ms(date)+DAY), grades = model.codes.lists['직급']||[];
    var rows = [];
    model.people.forEach(function(p){
      if (p.exec || !p.join || p.join > date || (p.leave && p.leave <= date) || (p.status==='퇴직') || P.exclude.indexOf(p.emp)>=0) return;
      var ten = diffYM(p.join, next), last = '';
      p.moves.forEach(function(mv){
        if (mv['발령구분']!=='승격' || !mv['발령일'] || mv['발령일'] > date) return;
        var a = toCL(mv['변경후'], P, grades), b = toCL(mv['변경전'], P, grades);
        if (a && a!==b) last = mv['발령일'];          // 구직급 안에서만 오른 승격(예: 주임→대리)은 체류 시작으로 보지 않음
      });
      var stay = diffYM(last || p.join, next), total = monthsToYM(p.priorMonths + ten.total + ten.d/30);
      var rule = P.rules[p.grade], r = {p:p, tenure:ten, last:last, stay:stay, total:total, avg:null, ok:false, na:false, to:'', why:[]};
      if (!rule || p.status==='휴직'){ r.na = true; r.why.push(!rule ? p.grade+' 승격기준 없음' : '휴직 중'); }
      var ny = rule ? rule.years : maxYears, ys = [], y0 = june ? Y-ny : Y-ny+1; for (var y=y0;y<y0+ny;y++) ys.push(y);
      var sc = ys.map(function(y){ return P.score[p.evals[y]]; }).filter(function(v){ return typeof v==='number' && !isNaN(v); });
      if (sc.length){ r.avg = sc.reduce(function(s,v){ return s+v; },0)/sc.length; r.avgYears = sc.length; r.avgFull = sc.length===ny; }   // 평가가 모자라면 있는 연도 평균을 참고로만 표시
      if (rule){
        if (!r.na){
          var have = rule.kind==='당사 근속' ? ten.total : total.total;
          if (have < rule.months) r.why.push(rule.kind+' '+have+'개월 (기준 '+rule.months+'개월)');
          if (!r.avgFull) r.why.push('평가 '+rule.years+'개년('+ys[0]+'~'+ys[ys.length-1]+') 중 '+(r.avgYears||0)+'개년만 있음');
          else if (r.avg < rule.avg) r.why.push('평균 '+Math.round(r.avg)+'점 (기준 '+rule.avg+'점)');
          r.ok = !r.why.length; if (r.ok) r.to = rule.to;
        }
      }
      rows.push(r);
    });
    rows.sort(function(a,b){ return a.p.join < b.p.join ? -1 : a.p.join > b.p.join ? 1 : 0; });
    return rows;
  }

  /* 기준일에 따라 달라지는 값 */
  function derive(model, baseDate){
    var Y = +baseDate.slice(0,4), L = model.codes.lists;
    var rank = function(list, v){ var i = (list||[]).indexOf(v); return i<0 ? 99 : i; };
    model.people.forEach(function(p){
      p.left = !!(p.leave && p.leave <= baseDate) || (p.status==='퇴직' && !p.leave);
      p.state = p.left ? '퇴직' : (p.status==='휴직' ? '휴직' : '재직');
      p.leftThisYear = p.left && p.leave && +p.leave.slice(0,4)===Y;
      p.inScope = !p.left || p.leftThisYear;            // 전체 인원 대상
      p.joinedThisYear = !!p.join && +p.join.slice(0,4)===Y && p.join<=baseDate;
      var end = p.left && p.leave ? ymd(ms(p.leave)+DAY) : baseDate;
      p.tenure = diffYM(p.join, end);
      var cd = careerDays(p.careers, p.join);
      p.priorMonths = p.priorManual!==null ? p.priorManual : cd;
      p.totalCareer = p.tenure ? monthsToYM(p.priorMonths + p.tenure.total + p.tenure.d/30) : null;
      // 알림
      p.alerts = [];
      if (!p.left){
        if (p.leave && p.leave > baseDate) p.alerts.push({cls:'warn', t:'퇴사 예정 '+p.leave.slice(5)});
        if (p.endDate){ var dd = Math.round((ms(p.endDate)-ms(baseDate))/DAY); if (dd>=0 && dd<=30) p.alerts.push({cls:'warn', t:(p.emp==='시용직'?'시용':'계약')+' 종료 D-'+dd}); else if (dd<0) p.alerts.push({cls:'err', t:'종료예정일 경과'}); }
        if (p.join) [10,20].forEach(function(n){
          if (+p.join.slice(0,4)+n === Y+1) p.alerts.push({cls:'info', t:'내년 근속 '+n+'년 ('+(Y+1)+p.join.slice(4)+')'});
        });
      }
      // 인상률
      p.raise = {};
      Object.keys(p.sal).forEach(function(y){ var prev = p.sal[y-1]; if (prev) p.raise[y] = (p.sal[y]-prev)/prev; });
      // 하위등급 연속
      var y0 = p.evals[Y] ? Y : Y-1, c=0, d=0, y;
      for (y=y0; p.evals[y]==='C'||p.evals[y]==='D'; y--) c++;
      for (y=y0; p.evals[y]==='D'; y--) d++;
      p.lowRun = (!p.exec && p.inScope && (c>=3 || d>=2)) ? (d>=2 ? 'D '+d+'년 연속' : 'C 이하 '+c+'년 연속') : '';
      // 고성과 / 5년 연평균 인상률
      var hi=0; for (y=Y-4;y<=Y;y++) if (p.evals[y]==='S'||p.evals[y]==='A') hi++;
      p.hiCount = hi;
      var ys = []; for (y=Y-5;y<=Y;y++) if (p.sal[y]) ys.push(y);
      p.cagr = (ys.length>=3) ? Math.pow(p.sal[ys[ys.length-1]]/p.sal[ys[0]], 1/(ys[ys.length-1]-ys[0])) - 1 : null;
      p.cagrSpan = ys.length>=3 ? ys[0]+'→'+ys[ys.length-1] : '';
    });
    var gAvg = {};
    model.people.forEach(function(p){ if (p.inScope && !p.exec && p.cagr!==null){ (gAvg[p.grade] = gAvg[p.grade] || []).push(p.cagr); } });
    Object.keys(gAvg).forEach(function(g){ var a = gAvg[g]; gAvg[g] = {avg:a.reduce(function(s,v){return s+v;},0)/a.length, n:a.length}; });
    model.people.forEach(function(p){
      var ga = gAvg[p.grade];
      p.gradeAvg = ga ? ga.avg : null;
      p.hiLo = !!(!p.exec && p.inScope && p.hiCount>=3 && p.cagr!==null && ga && p.cagr < ga.avg);
      p.caution = !!(p.lowRun || p.hiLo);
    });
    // 정렬: 조직도 → 퇴직자 맨 아래 → 직책 → 직급 → 입사일
    var divOrder = function(p){ var o = model.codes.org[p.org.div]; return o ? o.order : 9999; };
    model.people.sort(function(a,b){
      return divOrder(a)-divOrder(b) || (a.org.order-b.org.order) || (a.left-b.left) || rank(L['직책'],a.pos)-rank(L['직책'],b.pos) || rank(L['직급'],a.grade)-rank(L['직급'],b.grade)
        || ((a.join||'9') < (b.join||'9') ? -1 : (a.join===b.join ? 0 : 1));
    });
    // 요약
    var mean = function(a){ return a.length ? a.reduce(function(s,v){return s+v;},0)/a.length : null; };
    var salOf = function(list){ return list.filter(function(p){ return p.sal[Y]; }).map(function(p){ return p.sal[Y]; }); };
    var scope = model.people.filter(function(p){ return p.inScope; });
    var joiners = scope.filter(function(p){ return p.joinedThisYear; }), leavers = scope.filter(function(p){ return p.leftThisYear; });
    var raisers = scope.filter(function(p){ return p.evals[Y] && p.sal[Y] && p.sal[Y-1]; });

  /* 연봉 막대(위) + 인상률 꺾은선(아래): 단위가 달라 축을 공유하지 않고 연도만 맞춰 위아래로 배치 */
  function chart(p, ys){
    var W=760, x0=58, x1=W-16, bw=Math.min(54,(x1-x0)/ys.length*0.5), step=(x1-x0)/ys.length;
    var top=26, bh=150, gap=44, lh=84, H=top+bh+gap+lh+30;
    var maxS = Math.max.apply(null, ys.map(function(y){ return p.sal[y]||0; })), mag = Math.pow(10, Math.floor(Math.log10(maxS/4))), unit = [1,2,2.5,5,10].map(function(k){ return k*mag; }).filter(function(u){ return u >= maxS/4; })[0], tmax = Math.ceil(maxS/unit)*unit;
    var rates = ys.map(function(y){ return p.raise[y]; }).filter(function(v){ return v!=null; });
    var rmax = Math.max(0.02, Math.max.apply(null, rates.concat([0]))), rmin = Math.min(0, Math.min.apply(null, rates.concat([0])));

    for (var t=0;t<=tmax+1;t+=unit){ s += '<line x1="'+x0+'" x2="'+x1+'" y1="'+sy(t)+'" y2="'+sy(t)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(x0-8)+'" y="'+(sy(t)+4)+'" text-anchor="end">'+Math.round(t/10000).toLocaleString()+'</text>'; }
    [rmax-pad, 0, rmin<0?rmin+pad:null].forEach(function(v){ if (v==null) return; s += '<line x1="'+x0+'" x2="'+x1+'" y1="'+ry(v)+'" y2="'+ry(v)+'" stroke="var(--line)" stroke-width="'+(v===0?1.5:1)+'"'+(v===0?'':' stroke-dasharray="3 3"')+'/><text x="'+(x0-8)+'" y="'+(ry(v)+4)+'" text-anchor="end">'+(v*100).toFixed(1)+'</text>'; });
    var pts = [];

      if (p.sal[y]){ var yy = sy(p.sal[y]), r = Math.min(4, (top+bh-yy)); s += '<path d="M'+(cx(i)-bw/2)+' '+(top+bh)+'V'+(yy+r)+'q0 -'+r+' '+r+' -'+r+'h'+(bw-2*r)+'q'+r+' 0 '+r+' '+r+'V'+(top+bh)+'Z" fill="var(--accent)"/>'; }

    });
    if (pts.length) s += '<polyline fill="none" stroke="var(--accent2)" stroke-width="2" stroke-linejoin="round" points="'+pts.map(function(q){ return q[0]+','+q[1]; }).join(' ')+'"/>';
    pts.forEach(function(q,i){ s += '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4.5" fill="var(--accent2)" stroke="var(--surface)" stroke-width="2"/>'; if (i===pts.length-1 || pts.length<=6) s += '<text x="'+q[0]+'" y="'+(q[1]-10)+'" text-anchor="middle" style="fill:var(--ink)">'+pct(q[2],1)+'</text>'; });
    ys.forEach(function(y,i){ s += '<rect class="hit" data-y="'+y+'" x="'+(x0+step*i)+'" y="'+top+'" width="'+step+'" height="'+(H-top-24)+'" fill="transparent"/>'; });

  function promoPrint(){
    var rows = S.promoRows;
    $('#printCard').className = 'promo-print';
    $('#printCard').innerHTML = '<h1 style="text-align:center;border:0">'+promoTitle()+'</h1><div class="ph" style="justify-content:center">'+promoSub(rows)+'</div><table><tr>'+PROMO_HEAD.map(function(h){ return '<th>'+h+'</th>'; }).join('')+'</tr>'
      + rows.map(function(r){ return '<tr class="'+(r.ok?'ok':'')+'">'+promoRow(r).map(function(v){ return '<td>'+esc(v)+'</td>'; }).join('')+'</tr>'; }).join('')+'</table><section class="note"><h2>'+PROMO_NOTE+'</h2><div class="notebox"></div></section>';
    window.print();
  }

  /* ---------- 검사 결과 ---------- */
  function simpleDialog(title, body, w){
    var sc = $('#miscScrim');
    sc.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" style="width:min('+(w||760)+'px,100%)"><div class="dhead"><h2 style="flex:1">'+title+'</h2><button class="x" data-close aria-label="닫기">×</button></div><div class="dbody" style="padding-top:0">'+body+'</div></div>';
    sc.classList.remove('hidden');
  }
  function alertBox(t, msg){ simpleDialog(esc(t), '<p>'+esc(msg)+'</p>'); }
  function openValidation(){
    var is = S.model.issues, e = is.filter(function(i){ return i.lv==='err'; }).length;
    var body = '<div class="vsum"><div><b>'+S.model.people.length+'</b>읽은 인원</div><div><b style="color:var(--err)">'+e+'</b>오류</div><div><b style="color:var(--warn)">'+(is.length-e)+'</b>확인 필요</div></div>';
    body += is.length ? tbl(['수준','검사','위치','대상','내용'], is.map(function(i){ return '<tr><td><span class="badge '+(i.lv==='err'?'err':'warn')+'">'+(i.lv==='err'?'오류':'확인')+'</span></td><td>'+esc(i.type)+'</td><td>'+esc(i.sheet)+(i.row?' '+i.row+'행':'')+'</td><td>'+esc(i.name||'-')+'</td><td>'+esc(i.msg)+'</td></tr>'; }).join(''))
      : '<div class="none">검사 항목에 걸린 내용이 없습니다.</div>';
    body += '<p style="color:var(--sub);font-size:12.5px;margin:14px 0 0">오류가 있어도 화면은 열리며, 해당 인원 카드에 배지가 붙습니다. 엑셀을 고친 뒤 파일을 다시 선택하면 갱신됩니다.</p>';
    simpleDialog('업로드 검사 결과', body);
  }

  /* ---------- 둘러보기 안내 ---------- */
  var TOUR = [
    ['#cards','요약 카드','기준일 연도의 인원, 입·퇴사자, 평균 인상률, 주의 인원입니다. 카드를 누르면 아래 목록이 그 인원만 남습니다.'],
    ['#filters','필터와 검색','사업부·본부 → 실 → 팀 순으로 좁히고, 고용형태·직급·재직상태로 거를 수 있습니다.'],
    ['#list .pcard, #list tbody tr','인원 카드','조직도 순서로 묶여 있습니다. 누르면 개인 인사정보 창이 탭 구조로 열립니다. 오류·확인 배지는 엑셀을 손봐야 할 곳입니다.'],
    ['#promoBtn','승격 심사','6월·12월 회차를 고르면 _승격기준 시트의 기준으로 승격대상자 명단을 만들고, 엑셀 저장과 인쇄를 할 수 있습니다.'],
    ['#valBtn','업로드 검사 결과','가상 데이터에 일부러 넣어 둔 누락·불일치가 어떻게 잡히는지 볼 수 있습니다.'],
    ['#hideSwitch','민감 정보 숨김','평가·보상, 상벌, 주요 이슈 탭과 주의 카드를 가립니다. 화면을 다른 사람 앞에 띄울 때 켭니다.'],
    ['#themeSeg','라이트 / 다크','화면 밝기를 바꿉니다. 선택은 이 브라우저에 기억됩니다.']
  ];
  var tourI = -1;
  function tour(i){
    tourI = i; var pop = $('#tourPop'), ring = $('#tourRing');
    if (i<0 || i>=TOUR.length){ pop.classList.add('hidden'); ring.classList.add('hidden'); tourI = -1; return; }
    var el = $(TOUR[i][0]); if (!el){ return tour(i+1); }
    el.scrollIntoView({block:'nearest'});
    var r = el.getBoundingClientRect();
    ring.style.cssText = 'left:'+(r.left-6)+'px;top:'+(r.top-6)+'px;width:'+(r.width+12)+'px;height:'+(r.height+12)+'px'; ring.classList.remove('hidden');
    pop.innerHTML = '<h6>'+TOUR[i][1]+'</h6><p>'+TOUR[i][2]+'</p><div class="row"><span style="flex:1">'+(i+1)+' / '+TOUR.length+'</span><button class="skip" data-tour="-1">그만 보기</button><button data-tour="'+(i+1)+'">'+(i===TOUR.length-1?'마침':'다음')+'</button></div>';
    pop.classList.remove('hidden');
    var top = r.bottom+14, left = Math.min(Math.max(12, r.left), window.innerWidth-312);
    if (top+pop.offsetHeight > window.innerHeight-8) top = Math.max(8, r.top-pop.offsetHeight-14);
    if (r.height > window.innerHeight*0.6){ top = 90; left = Math.min(window.innerWidth-312, r.right+14); if (left < r.right) left = window.innerWidth-320; }
    pop.style.left = left+'px'; pop.style.top = top+'px';
  }

  /* ---------- 이벤트 ---------- */
  function setTheme(t){ S.theme = t; document.body.dataset.theme = t; store.set('hr.theme', t); $$('#themeSeg button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.theme===t); }); }
  function toggleCard(k){ S.card = S.card===k ? null : k; render(); }
  document.addEventListener('click', function(e){
    var t = e.target, el;
    if ((el = t.closest('[data-card]'))){ e.stopPropagation(); toggleCard(el.dataset.card); return; }
    if ((el = t.closest('.pcard, table.list tbody tr'))){ openPerson(findP(el)); return; }
    if ((el = t.closest('[data-tab]'))){ openPerson(S.openP, el.dataset.tab); return; }
    if ((el = t.closest('[data-view]'))){ S.view = el.dataset.view; store.set('hr.view', S.view); render(); return; }
    if ((el = t.closest('[data-theme]')) && el.tagName==='BUTTON'){ setTheme(el.dataset.theme); if (tourI>=0) tour(tourI); return; }
    if ((el = t.closest('[data-tour]'))){ tour(+el.dataset.tour); return; }
    if (t.id==='closeP' || t.id==='personScrim'){ closePerson(); return; }
    if (t.id==='printBtn'){ printCard(S.openP); return; }
    if (t.closest('[data-close]') || t.id==='miscScrim'){ $('#miscScrim').classList.add('hidden'); return; }
    if (t.closest('[data-demo]')){ load(SAMPLE, '샘플데이터', true); tour(0); return; }
    if (t.closest('[data-pick]')){ $('#fileInput').click(); return; }
    if (t.closest('[data-photos]')){ $('#photoInput').click(); return; }
    if (t.id==='valBtn' || t.closest('#valBtn')){ openValidation(); return; }
    if (t.id==='promoBtn'){ if (S.model) openPromo(); return; }
    if (t.id==='promoXlsx'){ promoXlsx(); return; }
    if (t.id==='promoPrint'){ promoPrint(); return; }
    if (t.id==='exitDemo'){ location.reload(); return; }
    if (t.id==='tourBtn'){ tour(0); return; }
    if (t.id==='resetF'){ S.f = {div:'',sil:'',team:'',emp:'',grade:'',state:'',q:''}; S.card = null; $('#q').value=''; fillFilters(); render(); return; }
  });
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape'){ if (tourI>=0) tour(-1); else if (!$('#miscScrim').classList.contains('hidden')) $('#miscScrim').classList.add('hidden'); else closePerson(); }
    if ((e.key==='Enter' || e.key===' ') && e.target.matches('[role=button],table.list tbody tr')){ e.preventDefault(); e.target.click(); }
  });
  $('#fileInput').addEventListener('change', function(){ if (this.files[0]) readFile(this.files[0]); this.value=''; });
  $('#photoInput').addEventListener('change', function(){ readPhotos(this.files); });
  $('#baseDate').value = S.base;
  $('#baseDate').addEventListener('change', function(){ if (!this.value) return; S.base = this.value; if (S.model){ recalc(); render(); } });
  $('#q').addEventListener('input', function(){ S.f.q = this.value; if (S.model) render(); });
  [['fDiv','div'],['fSil','sil'],['fTeam','team'],['fEmp','emp'],['fGrade','grade'],['fState','state']].forEach(function(a){
    $('#'+a[0]).addEventListener('change', function(){ S.f[a[1]] = this.value; if (a[1]==='div'){ S.f.sil=''; S.f.team=''; } if (a[1]==='sil') S.f.team=''; fillFilters(); render(); });
  });
  document.addEventListener('change', function(e){ if (e.target.id==='promoSel') openPromo(e.target.value); });
  $('#hide').addEventListener('change', function(){ S.hide = this.checked; $('#promoBtn').classList.toggle('hidden', S.hide); if (S.hide && ['raise','caution','low','hilo'].indexOf(S.card)>=0) S.card=null; if (S.model) render(); if (S.openP) openPerson(S.openP, S.tab); });
  window.addEventListener('resize', function(){ if (tourI>=0) tour(tourI); });
  setTheme(S.theme);
  window.__hr = {openPromo:openPromo, S:S, load:load, openPerson:openPerson, setTheme:setTheme, tour:tour, openValidation:openValidation};
})();

</script>
</body>
</html>
